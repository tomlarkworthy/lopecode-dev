<script type="module">
  // Catch and surface async failures so the driver can read them.
  window.__errors = [];
  window.addEventListener("error", (e) => { window.__errors.push({ kind: "error", message: e.message, stack: e.error?.stack }); });
  window.addEventListener("unhandledrejection", (e) => {
    const r = e.reason;
    if (r && r.name === "ProcessExit") { window.__cliExit = r.code; return; }
    window.__errors.push({ kind: "unhandledrejection", message: String(r?.message || r), stack: r?.stack });
    console.error("[unhandledrejection]", r?.message || r, "\n", (r?.stack || "").split("\n").slice(0, 8).join("\n"));
  });
  window.__fetchLog = [];
  const _fetch = globalThis.fetch.bind(globalThis);
  globalThis.fetch = (input, init) => {
    const url = typeof input === "string" ? input : input?.url;
    console.log("[fetch] " + (init?.method || "GET") + " " + url);
    window.__fetchLog.push(url);
    return _fetch(input, init).then((r) => { console.log("[fetch<-] " + r.status + " " + url); return r; }, (e) => { console.error("[fetch-x] " + url + " " + e.message); throw e; });
  };
</script>
