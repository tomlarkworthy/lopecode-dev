<!doctype html>
<meta charset="utf-8">
<title>Horde sim bench</title>
<body style="background:#000;color:#9fe;font:13px monospace">
<pre id="out">running</pre>
<script>
// bench.html?mode=main|copy|transfer|sab|lite&workers=8&n=10000&warm=300&frames=240&sim=strict|raw
// The bot plays (fires, shockwaves every 5 s), every agent is active, the player cannot die.
const q = new URLSearchParams(location.search);
const load = (src) => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load " + src)); document.head.append(s); });
(async () => {
  const out = document.getElementById("out");
  try {
    for (const f of [q.get("sim") && q.get("sim") !== "strict" ? `sim-${q.get("sim")}.gen.js` : "sim.gen.js", "lite-job.js", "lite-pool.js", "engine.js"]) await load(f);
    const mode = q.get("mode") || "main", n = +(q.get("n") || 10000), workers = +(q.get("workers") || 4);
    const warm = +(q.get("warm") || 300), frames = +(q.get("frames") || 240);
    const e = makeEngine({ n, mode, workers, bot: true, god: true, fullWave: true, renderer: false });
    const rows = [];
    for (let f = 0; f < warm + frames; f++) {
      const s = await e.step();
      if (f >= warm) rows.push({ ...s });
    }
    const sorted = (k) => rows.map((r) => r[k]).sort((a, b) => a - b);
    const med = (k) => sorted(k)[rows.length >> 1];
    const p90 = (k) => sorted(k)[Math.floor(rows.length * 0.9)];
    const mean = (k) => rows.reduce((a, r) => a + r[k], 0) / rows.length;
    const r = { mode, n, sim: q.get("sim") || "strict", workers: e.poolSize, frames: rows.length, total: med("total"), totalMean: mean("total"), totalP90: p90("total"), serial: med("serial"), post: med("post"), round: med("round"), kills: e.kills, hash: e.hash(), coi: self.crossOriginIsolated, hc: navigator.hardwareConcurrency };
    e.close();
    window.__bench = r;
    out.textContent = JSON.stringify(r, null, 1);
  } catch (err) { window.__bench = { error: String((err && err.stack) || err) }; out.textContent = window.__bench.error; }
})();
</script>
