<style>
  /* Layout: a two-up contact sheet of 16:10 boards, caption under each. */
  :root {

  }

  :root[data-theme="dark"] { --bg: #111113; --fg: #ececee; --muted: #8b8b90; --line: #2a2a2e; --card: #18181b; color-scheme: dark; }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 48px 16px 80px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 24px; margin-bottom: 32px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); font: 13px/1.4 var(--mono); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 40px 28px; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  figure svg { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 4px; outline: 1px solid var(--line); }
  figcaption { display: grid; grid-template-columns: 2.2em 1fr; gap: 2px 0; }
  .id { font: 13px/1.5 var(--mono); color: var(--muted); grid-row: span 3; }
  .t { font-weight: 650; }
  .d, .n { color: var(--muted); font-size: 14px; max-width: 62ch; }

</style>
