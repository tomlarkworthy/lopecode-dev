<title>Single File Revolution Concepts</title>
<style>
  /* Layout: a quiet two-up contact sheet, small captions. */
  :root {
    --bg: #f4f3f0; --fg: #232226; --muted: #75737a; --line: #deddd8;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151517; --fg: #e9e8ec; --muted: #8e8d94; --line: #2b2b2f; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #151517; --fg: #e9e8ec; --muted: #8e8d94; --line: #2b2b2f; color-scheme: dark; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--serif); }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 56px 16px 96px; }
  h1 { margin: 0 0 40px; font-size: 22px; font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 48px 28px; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  figure svg { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; max-width: 100%; outline: 1px solid var(--line); }
  figcaption { color: var(--muted); font-size: 14px; max-width: 60ch; }
  figcaption b { color: var(--fg); font-weight: 400; font-style: italic; margin-right: .4em; }
</style>
