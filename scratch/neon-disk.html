<!doctype html>
<html><head><meta charset="utf8"><style>
  html,body{margin:0;height:100%;background:#02030a;display:grid;place-items:center}
  svg{width:min(90vw,720px)}
</style></head><body>
<svg viewBox="0 0 320 220" width="100%" style="max-height:520px" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#16204f"/>
      <stop offset="0.55" stop-color="#0a0e22"/>
      <stop offset="1" stop-color="#03040d"/>
    </radialGradient>
    <linearGradient id="neonBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#7b2bff;#00f0ff" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff2bd6"><animate attributeName="stop-color" values="#ff2bd6;#2b6bff;#ff2bd6" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="hubGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#0a2b6b"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#b06bff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter>
    <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="diskClip"><path d="M6,62H58a2,2,0,0,0,2-2V15a2,2,0,0,0-.586-1.414l-11-11A2,2,0,0,0,47,2H6A2,2,0,0,0,4,4V60A2,2,0,0,0,6,62Z"/></clipPath>
  </defs>

  <rect x="0" y="0" width="320" height="220" fill="#03040d"/>
  <rect x="0" y="0" width="320" height="220" fill="url(#bgGlow)"/>

  <rect x="0" y="0" width="320" height="2.5" fill="url(#scan)" opacity="0.55"><animate attributeName="y" values="-4;222" dur="4.2s" repeatCount="indefinite"/></rect>

  <circle cx="58" cy="180" r="1.3" fill="#00f0ff"><animate attributeName="cy" values="205;15" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="250" cy="180" r="1" fill="#ff2bd6"><animate attributeName="cy" values="210;20" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="180" r="1.1" fill="#7b2bff"><animate attributeName="cy" values="200;10" dur="6.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="6.2s" repeatCount="indefinite"/></circle>

  <g transform="translate(160 92)">
    <circle r="88" fill="none" stroke="#7b2bff" stroke-width="1" stroke-dasharray="2 9" opacity="0.35"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="18s" repeatCount="indefinite"/></circle>
    <circle r="99" fill="none" stroke="#00f0ff" stroke-width="0.6" stroke-dasharray="1 13" opacity="0.25"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="26s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(160 92)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0; 0 -5; 0 0" dur="4.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="-2.6 0 0; 2.6 0 0; -2.6 0 0" dur="7.5s" repeatCount="indefinite"/>
    <g transform="scale(2.15) translate(-32 -32)">
      <g filter="url(#soft)">
        <path d="M6,62H58a2,2,0,0,0,2-2V15a2,2,0,0,0-.586-1.414l-11-11A2,2,0,0,0,47,2H6A2,2,0,0,0,4,4V60A2,2,0,0,0,6,62Z" fill="#00f0ff"/>
        <path d="M32,38a8,8,0,1,0-8-8A8.009,8.009,0,0,0,32,38Zm0-12a4,4,0,1,1-4,4A4,4,0,0,1,32,26Z" fill="#ff2bd6"/>
        <animate attributeName="opacity" values="0.5;0.95;0.55;0.85;0.5" keyTimes="0;0.3;0.5;0.75;1" dur="2.4s" repeatCount="indefinite"/>
      </g>
      <path d="M6,62H58a2,2,0,0,0,2-2V15a2,2,0,0,0-.586-1.414l-11-11A2,2,0,0,0,47,2H6A2,2,0,0,0,4,4V60A2,2,0,0,0,6,62Zm42-4H16V46H48ZM16,6H31v4h4V6h4v8H16ZM8,6h4V16a2,2,0,0,0,2,2H41a2,2,0,0,0,2-2V6h3.172L56,15.829V58H52V44a2,2,0,0,0-2-2H14a2,2,0,0,0-2,2V58H8Z" fill="url(#neonBody)"/>
      <rect x="20" y="50" width="4" height="4" fill="#c8fbff"/>
      <rect x="28" y="50" width="16" height="4" fill="#c8fbff"/>
      <circle cx="32" cy="30" r="3" fill="#ffffff"><animate attributeName="r" values="1.4;3.6;1.4" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/></circle>
      <path d="M32,38a8,8,0,1,0-8-8A8.009,8.009,0,0,0,32,38Zm0-12a4,4,0,1,1-4,4A4,4,0,0,1,32,26Z" fill="url(#hubGlow)"><animate attributeName="opacity" values="0.85;1;0.85" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M6,62H58a2,2,0,0,0,2-2V15a2,2,0,0,0-.586-1.414l-11-11A2,2,0,0,0,47,2H6A2,2,0,0,0,4,4V60A2,2,0,0,0,6,62Z" fill="none" stroke="#eaffff" stroke-width="0.8" stroke-dasharray="6 11" stroke-linecap="round" opacity="0.9"><animate attributeName="stroke-dashoffset" values="0;-170" dur="3s" repeatCount="indefinite"/></path>
      <g clip-path="url(#diskClip)"><rect x="-24" y="-8" width="11" height="84" fill="url(#sheen)" transform="rotate(18 32 32)"><animate attributeName="x" values="-26;72" dur="3.6s" repeatCount="indefinite"/></rect></g>
    </g>
  </g>

  <rect x="8" y="8" width="304" height="204" rx="11" fill="none" stroke="url(#wordGrad)" stroke-width="1.4" stroke-dasharray="15 10" opacity="0.65"><animate attributeName="stroke-dashoffset" values="0;-50" dur="4s" repeatCount="indefinite"/></rect>

  <g>
    <text x="157" y="200" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="21" letter-spacing="7" fill="#00f0ff" filter="url(#soft2)">LOPECODE</text>
    <text x="157" y="200" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="21" letter-spacing="7" fill="url(#wordGrad)">LOPECODE</text>
    <animate attributeName="opacity" values="1;1;0.35;1;0.8;1;1" keyTimes="0;0.5;0.54;0.58;0.62;0.66;1" dur="5.5s" repeatCount="indefinite"/>
  </g>
</svg>
</body></html>
